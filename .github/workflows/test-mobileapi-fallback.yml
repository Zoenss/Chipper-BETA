name: Test MobileAPI fallback
on:
  push:
    branches: [fix/reconhecer-samsung-a16]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reconhecer-samsung-a16
      - name: Patch hybrid flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/hybrid_product_service.py')
          t = p.read_text(encoding='utf-8')
          old = '''    if _categoria_mobile(\n        str(\n            categoria_para_mobile\n        )\n    ):'''
          new = '''    deve_tentar_mobile = (\n        _categoria_mobile(str(categoria_para_mobile))\n        or str(categoria_para_mobile) == "desconhecido"\n    )\n\n    if deve_tentar_mobile:'''
          if old not in t:
              raise SystemExit('Trecho esperado nao encontrado')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Validate syntax
        run: python -m py_compile services/hybrid_product_service.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/hybrid_product_service.py
          git commit -m "Try MobileAPI when category is unknown" || exit 0
          git push
