name: Ativar exportacao CSV

on:
  push:
    branches:
      - feature/ativar-exportacao-csv

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Activate CSV export button') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ativar-exportacao-csv

      - name: Ativar botao de exportacao
        shell: python
        run: |
          from pathlib import Path

          path = Path('pages/02_analisar.py')
          text = path.read_text(encoding='utf-8')

          import_old = "from services.hybrid_product_service import resolver_produto_hibrido\n"
          import_new = (
              "from services.export_service import gerar_csv_analise\n"
              "from services.hybrid_product_service import resolver_produto_hibrido\n"
          )
          if "from services.export_service import gerar_csv_analise" not in text:
              if import_old not in text:
                  raise SystemExit('Ponto de importacao nao encontrado')
              text = text.replace(import_old, import_new, 1)

          button_old = '''with col_exportar:\n    st.button(\n        "EXPORTAR CSV",\n        disabled=True,\n        help=(\n            "A exportação CSV poderá ser ativada em uma próxima etapa."\n        ),\n    )'''

          button_new = '''with col_exportar:\n    csv_analise = gerar_csv_analise(\n        equipamento=nome_aparelho,\n        quantidade=quantidade,\n        massa_total_g=massa_total,\n        massa_media_g=massa_media,\n        categoria=categoria_analise,\n        fonte_principal=origem_categoria,\n        fontes_utilizadas=fontes_utilizadas,\n        materiais=materiais,\n        materiais_economicos=materiais_economicos,\n        massa_recuperavel_g=massa_recuperavel,\n        percentual_recuperavel=percentual_recuperavel,\n        valor_total_estimado=valor_total,\n        recomendacoes=recomendacoes,\n    )\n\n    nome_arquivo = (\n        "chipper_"\n        + "".join(\n            caractere.lower() if caractere.isalnum() else "_"\n            for caractere in nome_aparelho\n        ).strip("_")\n        + ".csv"\n    )\n\n    st.download_button(\n        "EXPORTAR CSV",\n        data=csv_analise,\n        file_name=nome_arquivo,\n        mime="text/csv",\n        use_container_width=True,\n        help="Baixar os resultados desta análise em CSV.",\n    )'''

          if "st.download_button(" not in text:
              if button_old not in text:
                  raise SystemExit('Botao antigo nao encontrado')
              text = text.replace(button_old, button_new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validar sintaxe
        run: python -m py_compile pages/02_analisar.py services/export_service.py

      - name: Commit da alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/02_analisar.py
          git diff --cached --quiet && exit 0
          git commit -m "Activate CSV export button"
          git push
